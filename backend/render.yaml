services:
  - type: web
    name: nudgeplan-api
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: HOST
        value: "0.0.0.0"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_MODEL_FALLBACKS
        value: gemini-3.6-flash,gemini-3.8-flash
      - key: GEMINI_TIMEOUT_SECONDS
        value: "15"
      - key: GEMINI_TOTAL_TIMEOUT_SECONDS
        value: "40"
      - key: MODEL_COOLDOWN_SECONDS
        value: "120"
      - key: GEMINI_RETRY_TRANSIENT
        value: "0"
      - key: GEMINI_MAX_OUTPUT_TOKENS
        value: "2048"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: AUTH_REQUIRED
        value: "true"
      - key: CORS_ORIGINS
        value: http://localhost:8081
      - key: PYTHON_VERSION
        value: "3.12.7"
