services:
  - type: web
    name: nudgeplan-api
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: AUTH_REQUIRED
        value: "true"
      - key: CORS_ORIGINS
        value: http://localhost:8081
      - key: PYTHON_VERSION
        value: "3.12.7"
